<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>君のために</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="btn-tema" id="btnTema" onclick="toggleTema()" title="Ganti tema">🌙</button>

  <div class="slide active" id="slide1">
    <div class="emoji">⏳</div>
    <div class="jam" id="jam">00:00</div>
    <div class="tanggal" id="tanggal">Memuat tanggal...</div>
    <div class="sapaan">Hey there! 👋</div>
    <div class="sub">"Check out what I made! 🚀" <br>wanna see?</div>
    <button id="btnBuka" onclick="mulaiTimer()">Open💫</button>
  </div>

  <div class="slide" id="slideTimer">
    <div class="timer-angka" id="timerAngka">3</div>
    <div class="timer-teks">Hold tight...</div>
  </div>

  <div class="slide" id="slide2">
    <h2>Choose One🎀</h2>
    <div class="sub">"Take your pick! 🎁"</div>
    <div class="menu-grid" id="menuList"></div>
    <div class="nav-row" style="margin-top:22px;">
      <button class="btn-kecil" onclick="nextSlide(1)">← Back</button>
    </div>
  </div>

  <div class="slide" id="slide3">
    <div class="emoji-besar" id="emojiPesan">💖</div>
    <h2 id="judulPesan">Judul</h2>
    <div class="pesan" id="isiPesan">Isi pesan...</div>
    <div class="nav-row">
      <button class="btn-kecil" onclick="nextSlide(2)">← Menu</button>
      <button id="btnMusik" onclick="toggleMusic()">🔇 Putar Lagu</button>
    </div>
  </div>

  <div class="slide" id="slide4">
    <div class="emoji-besar">🎆</div>
    <h2 id="judulPenutup">Thank You a bunch</h2>
    <div class="pesan" id="isiPenutup">The last message...</div>

    <form id="formBalasan" class="form-balasan">
      <label class="form-label">Write a reply for me 💌</label>
      <textarea name="pesan" id="inputBalasan" placeholder="Type anything you want here..." required></textarea>
      <input type="text" name="nama" id="inputNama" class="input-nama" placeholder="Your name (optional)" />
      <button type="submit" id="btnKirim" class="btn-kirim">Send Reply 💫</button>
      <div id="formStatus" class="form-status"></div>
    </form>

    <div class="pengirim-box">
      <div class="pengirim-label">From:</div>
      <div class="pengirim-nama" id="namaPengirim">Pengirim</div>
    </div>

    <div class="nav-row" style="margin-top:25px;">
      <button type="button" class="btn-kecil" onclick="nextSlide(2)">← Menu</button>
      <button type="button" class="btn-kecil" id="btnMusik2" onclick="toggleMusic()">🔊 Turn Off</button>
      <button type="button" class="btn-kecil" onclick="nextSlide(1)">🏠 First</button>
    </div>
  </div>

  <canvas id="canvasConfetti"></canvas>

  <audio id="musik" loop>
    <source src="moments.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
